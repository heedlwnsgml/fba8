- name: Prepare official Android platform tools on guest
  hosts: docker_hosts
  become: true
  tasks:
    - name: Require reviewed Android download and checksum
      ansible.builtin.assert:
        that:
          - android_platform_tools_url is match('^https://dl.google.com/android/repository/platform-tools_.+-linux.zip$')
          - android_platform_tools_sha256 is match('^[a-f0-9]{64}$')
    - name: Install archive tools and runtime support
      ansible.builtin.dnf:
        name: [unzip, libstdc++]
        state: present
    - name: Download verified official tools
      ansible.builtin.get_url:
        url: '{{ android_platform_tools_url }}'
        checksum: 'sha256:{{ android_platform_tools_sha256 }}'
        dest: /opt/travelplanner/android-platform-tools.zip
        mode: '0600'
      register: tools_archive
    - name: Unpack tools
      ansible.builtin.unarchive:
        src: /opt/travelplanner/android-platform-tools.zip
        dest: /opt/travelplanner/
        remote_src: true
      when: tools_archive.changed
    - name: Verify guest-visible devices
      ansible.builtin.command: /opt/travelplanner/platform-tools/adb devices
      changed_when: false

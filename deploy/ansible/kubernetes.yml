# Future stage only. Never target the currently deployed Docker host.
- name: Prepare dedicated kubeadm nodes
  hosts: kube_control_plane:kube_workers
  become: true
  vars:
    kube_minor: v1.37
    kube_allow_host_reconfiguration: false
  tasks:
    - name: Require reviewed dedicated nodes and explicit configuration approval
      ansible.builtin.assert:
        that:
          - kube_allow_host_reconfiguration | bool
          - inventory_hostname not in groups.get('docker_hosts', [])
          - groups.get('kube_control_plane', []) | length == 1
          - ansible_facts.distribution == 'CentOS'
          - ansible_facts.distribution_major_version == '10'
    - name: Install container runtime and networking packages
      ansible.builtin.dnf:
        name: [containerd.io, iproute-tc, socat, conntrack-tools]
        state: present
    - name: Configure kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/travelplanner-k8s.conf
        content: "overlay\nbr_netfilter\n"
        mode: '0644'
    - name: Load modules only if absent
      ansible.builtin.shell: 'test -d /sys/module/{{ item }} || { modprobe {{ item }}; echo LOADED; }'
      loop: [overlay, br_netfilter]
      register: modules
      changed_when: "'LOADED' in modules.stdout"
    - name: Write forwarding sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-travelplanner-k8s.conf
        content: "net.ipv4.ip_forward=1\nnet.bridge.bridge-nf-call-iptables=1\nnet.bridge.bridge-nf-call-ip6tables=1\n"
        mode: '0644'
      register: sysctl_file
    - name: Apply sysctl changes
      ansible.builtin.command: sysctl --system
      when: sysctl_file.changed
    - name: Disable active swap
      ansible.builtin.command: swapoff -a
      when: ansible_facts.swaptotal_mb | int > 0
    - name: Disable fstab swap with backup
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!#)(.+\s+swap\s+.+)$'
        replace: '# travelplanner kubeadm: \1'
        backup: true
    - name: Configure containerd 2 CRI and systemd cgroups with backup
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        mode: '0644'
        backup: true
        content: |
          version = 3
          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc]
            runtime_type = 'io.containerd.runc.v2'
          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
            SystemdCgroup = true
      register: runtime_config
    - name: Enable containerd
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true
        state: "{{ 'restarted' if runtime_config.changed else 'started' }}"
    - name: Add minor-specific official Kubernetes repository
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes {{ kube_minor }}
        baseurl: https://pkgs.k8s.io/core:/stable:/{{ kube_minor }}/rpm/
        enabled: true
        gpgcheck: true
        gpgkey: https://pkgs.k8s.io/core:/stable:/{{ kube_minor }}/rpm/repodata/repomd.xml.key
        exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni
    - name: Install kubeadm components
      ansible.builtin.dnf:
        name: [kubelet, kubeadm, kubectl]
        state: present
        disable_excludes: kubernetes
        install_weak_deps: false
    - name: Enable kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        enabled: true
        state: started

- name: Initialize a new control plane once
  hosts: kube_control_plane
  become: true
  tasks:
    - name: Require verified network add-on input
      ansible.builtin.assert:
        that:
          - kube_pod_cidr is defined
          - kube_advertise_address is defined
          - kube_cni_local_file is defined
          - kube_cni_sha256 is defined
    - name: Initialize only an empty control plane
      ansible.builtin.command:
        argv: [kubeadm, init, '--pod-network-cidr={{ kube_pod_cidr }}', '--apiserver-advertise-address={{ kube_advertise_address }}', '--cri-socket=unix:///run/containerd/containerd.sock']
        creates: /etc/kubernetes/admin.conf
    - name: Copy reviewed CNI manifest
      ansible.builtin.copy:
        src: '{{ kube_cni_local_file }}'
        dest: /root/travelplanner-cni.yml
        mode: '0600'
    - name: Check CNI checksum
      ansible.builtin.stat:
        path: /root/travelplanner-cni.yml
        checksum_algorithm: sha256
      register: cni_manifest
    - name: Refuse unverified CNI
      ansible.builtin.assert:
        that: cni_manifest.stat.checksum == kube_cni_sha256
    - name: Apply CNI declaratively
      ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /root/travelplanner-cni.yml
      register: cni_apply
      changed_when: "'created' in cni_apply.stdout or 'configured' in cni_apply.stdout"
    - name: Create short-lived worker join command
      ansible.builtin.command: kubeadm token create --ttl 30m --print-join-command
      register: kube_join
      changed_when: false
      no_log: true

- name: Join workers once
  hosts: kube_workers
  become: true
  tasks:
    - name: Join initialized control plane
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['kube_control_plane'][0]].kube_join.stdout }} --cri-socket=unix:///run/containerd/containerd.sock"
        creates: /etc/kubernetes/kubelet.conf
      no_log: true

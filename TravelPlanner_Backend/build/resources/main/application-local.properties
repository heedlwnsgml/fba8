# DB details will be set after the replacement database is received.
spring.config.import=file:./config/application-secret.yml,optional:file:./config/database-local.properties
spring.jpa.hibernate.ddl-auto=validate
server.address=127.0.0.1
server.port=8080

# The supplied SQL is authoritative; no automatic source-data rewriting.
transit.fares.sync-bundled-on-start=false
app.refresh.enabled=false
app.plan.translate-names=false

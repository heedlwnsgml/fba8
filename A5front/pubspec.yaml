name: ai_travel_planner
description: "AI Travel Planner"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.6.1

  # 화면 이동
  go_router: ^16.0.0

  # SVG 아이콘
  flutter_svg: ^2.2.0

  # Google Fonts
  google_fonts: ^6.3.0

  # HTTP 통신
  dio: ^5.9.0

  # 로컬 저장
  shared_preferences: ^2.5.3

  # 날짜 포맷
  intl: ^0.20.2

  # 권한
  permission_handler: ^12.0.3

  # Google Maps
  google_maps_flutter: ^2.14.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2

  # 현재 위치
  geolocator: 14.0.2

  # PDF 생성
  pdf: 3.12.0

  # PDF 공유 / 출력
  printing: 5.14.3

  # PDF 기기 저장
  public_file_saver: ^1.2.0
  webview_flutter: ^4.14.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true